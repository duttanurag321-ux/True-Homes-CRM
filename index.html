<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#F7F5F0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="True Homes" />
  <link rel="icon" type="image/png" href="/True-Homes-CRM/favicon-32.png" />
  <link rel="apple-touch-icon" href="/True-Homes-CRM/apple-touch-icon.png" />
  <link rel="manifest" href="/True-Homes-CRM/manifest.webmanifest" />
  <title>True Homes</title>
  <script type="text/javascript">
    // Other half of the GitHub Pages SPA fix — see public/404.html. Restores
    // the real intended path (e.g. /leads/abc123) before React Router mounts,
    // so a notification tap or a direct link lands on the right page instead
    // of the app just opening at Home every time.
    ;(function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (s) {
            return s.replace(/~and~/g, '&')
          })
          .join('?')
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
      }
    })(window.location)
  </script>
</head>
<body class="bg-base text-ink font-sans antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
